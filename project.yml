name: Lean
options:
  bundleIdPrefix: com.dipxsy
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.9.4
targets:
  Lean:
    type: application
    platform: macOS
    sources:
      - Lean
      - path: icons/lean.icon
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Lean
        PRODUCT_BUNDLE_IDENTIFIER: com.dipxsy.lean
        CODE_SIGN_ENTITLEMENTS: Lean/Lean.entitlements
        INFOPLIST_FILE: Lean/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: lean
  LeanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LeanTests
    dependencies:
      - target: Lean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dipxsy.lean.tests
        GENERATE_INFOPLIST_FILE: YES
